workflows:
  flutter-android-workflow:
    name: Tailor Shop Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - firebase
      flutter: 3.19.0
    scripts:
      - name: Extract Project Files
        script: |
          echo "Extracting project zip file..."
          unzip -o Tailor_Shop_Login_Source.zip -d .
          # ফোল্ডারগুলো আসলে কোথায় আছে তা খোঁজা
          find . -name "customer_app" -type d
          
      - name: Setup Firebase Configuration
        script: |
          echo "Setting up Firebase google-services.json..."
          # কাস্টমার অ্যাপের আসল লোকেশন খুঁজে বের করা
          CUSTOMER_PATH=$(find . -name "customer_app" -type d | head -n 1)
          if [ -z "$CUSTOMER_PATH" ]; then
            echo "customer_app not found! Using root."
            CUSTOMER_PATH="."
          fi
          echo "Found customer_app at: $CUSTOMER_PATH"
          mkdir -p "$CUSTOMER_PATH/android/app"
          echo "$ANDROID_FIREBASE_SECRET" > "$CUSTOMER_PATH/android/app/google-services.json"
          # পরবর্তী স্ক্রিপ্টের সুবিধার্থে পাথটি সেভ করে রাখা
          echo "export APP_PATH=$CUSTOMER_PATH" >> $CM_ENV
          
      - name: Flutter Package Get
        script: |
          cd $APP_PATH
          flutter packages pub get
          
      - name: Build Android APK
        script: |
          cd $APP_PATH
          flutter build apk --release
          
    artifacts:
      - "**/build/app/outputs/flutter-apk/*.apk"
